plugins {
    id 'fabric-loom' version '1.10.1'
    id 'maven-publish'
    id 'java'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Hibernate ORM with exact versions specified
    implementation 'org.hibernate.orm:hibernate-core:6.6.7.Final'
    implementation 'jakarta.persistence:jakarta.persistence-api:3.1.0'
    implementation 'jakarta.transaction:jakarta.transaction-api:2.0.1'
    implementation 'jakarta.annotation:jakarta.annotation-api:2.1.1'

    // Jandex for entity discovery
    implementation 'io.smallrye:jandex:3.5.0'

    // PostgreSQL driver with exact version
    implementation 'org.postgresql:postgresql:42.7.3'

    // Include all Hibernate dependencies in the mod jar
    include 'org.hibernate.orm:hibernate-core:6.6.7.Final'
    include 'jakarta.persistence:jakarta.persistence-api:3.1.0'
    include 'jakarta.transaction:jakarta.transaction-api:2.0.1'
    include 'jakarta.annotation:jakarta.annotation-api:2.1.1'
    include 'io.smallrye:jandex:3.5.0'
    include 'org.postgresql:postgresql:42.7.3'

    // Hibernate transitive dependencies
    include 'org.jboss.logging:jboss-logging:3.5.3.Final'
    include 'net.bytebuddy:byte-buddy:1.14.12'
    include 'org.jboss:jandex:2.4.3.Final'
    include 'com.fasterxml:classmate:1.6.0'
    include 'org.antlr:antlr4-runtime:4.13.0'
    include 'org.glassfish.jaxb:jaxb-runtime:4.0.5'
    include 'jakarta.xml.bind:jakarta.xml.bind-api:4.0.2'
    include 'jakarta.activation:jakarta.activation-api:2.1.3'
    include 'jakarta.validation:jakarta.validation-api:3.0.2'
    include 'org.hibernate.validator:hibernate-validator:8.0.1.Final'
    include 'org.glassfish:jakarta.el:4.0.2'
    include 'org.hibernate.common:hibernate-commons-annotations:6.0.6.Final'
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }

    // Include META-INF/services files from all dependencies
    from("${projectDir}/src/main/resources") {
        include "META-INF/**"
        duplicatesStrategy = DuplicatesStrategy.INCLUDE
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 21
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}"}
    }

    // Ensure dependencies are properly included and service files are merged
    duplicatesStrategy = DuplicatesStrategy.INCLUDE

    // Include all META-INF/services files
    from("${projectDir}/src/main/resources") {
        include "META-INF/**"
        duplicatesStrategy = DuplicatesStrategy.INCLUDE
    }
}

loom {
    mixin {
        defaultRefmapName = "craftmessage.refmap.json"
    }

    runs {
        client {
            property "fabric.log.level", "debug"
        }
        server {
            property "fabric.log.level", "debug"
        }
    }
}
